<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>はしるひとゲーム</title>
  <style>
    /* 全体・レイアウト設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #f0f4f8;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 400px;
      background: #87CEEB; /* 空の色 */
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* オーバーレイ画面（キャラ選択・リザルト） */
    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: 22px;
      color: #333;
      margin-bottom: 8px;
    }

    /* 最高記録表示 */
    .high-score-tag {
      font-size: 16px;
      font-weight: bold;
      color: #ff6b6b;
      background: #ffe3e3;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    /* スピードアップ演出表示 */
    #speedup-notice {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: 900;
      color: #ffeb3b;
      text-shadow: 3px 3px 0 #d32f2f, -2px -2px 0 #d32f2f, 2px -2px 0 #d32f2f, -2px 2px 0 #d32f2f;
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
    }
    .pop-animation {
      animation: popFade 1.2s ease-out forwards;
    }
    @keyframes popFade {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1.0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
    }

    /* キャラクター選択画面 */
    .char-container {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    .char-card {
      background: #fff;
      border: 3px solid #e0e0e0;
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      width: 95px;
      height: 115px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    .char-card:active {
      transform: scale(0.95);
      border-color: #ff6b6b;
    }
    .char-card img {
      max-width: 75px;
      max-height: 75px;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: brightness(1.25) contrast(1.05);
    }

    /* ボタンデザイン */
    .btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin: 8px;
      box-shadow: 0 4px 12px rgba(255,107,107,0.4);
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-secondary {
      background: #4ecdc4;
      box-shadow: 0 4px 12px rgba(78,205,196,0.4);
    }

    /* ゲームUI（スコア表示・ジャンプボタン） */
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    #score-display {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }
    #controls {
      pointer-events: auto;
      display: flex;
      justify-content: flex-end;
    }
    #jump-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      border: 4px solid #ff6b6b;
      color: #ff6b6b;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <!-- ゲーム描画用キャンバス -->
  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <!-- スピードアップ表示演出 -->
  <div id="speedup-notice" class="hidden">スピードアップ！</div>

  <!-- ゲームプレイ中の画面UI -->
  <div id="ui-layer" class="hidden">
    <div id="score-display">スコア: 0</div>
    <div id="controls">
      <button id="jump-btn">ジャンプ！</button>
    </div>
  </div>

  <!-- 1. キャラクター選択画面 -->
  <div id="select-screen" class="screen">
    <h1>はしるひとをえらんでね</h1>
    <div id="high-score-select" class="high-score-tag">さいこうきろく: 0点</div>
    <div class="char-container">
      <div class="char-card" onclick="selectCharacter('image/run1.png')">
        <img src="image/run1.png" alt="ランナー1">
      </div>
      <div class="char-card" onclick="selectCharacter('image/IMG_5616.png')">
        <img src="image/IMG_5616.png" alt="ランナー2">
      </div>
      <div class="char-card" onclick="selectCharacter('image/run3.png')">
        <img src="image/run3.png" alt="ランナー3">
      </div>
    </div>
  </div>

  <!-- 2. リザルト画面 -->
  <div id="result-screen" class="screen hidden">
    <h1>ゲームオーバー</h1>
    <p id="final-score" style="font-size: 24px; font-weight: bold; color: #333; margin-bottom: 6px;">スコア: 0</p>
    <p id="high-score-result" style="font-size: 16px; color: #ff6b6b; font-weight: bold; margin-bottom: 20px;">さいこうきろく: 0点</p>
    <button class="btn" onclick="retryGame()">もう一度</button>
    <button class="btn btn-secondary" onclick="backToSelect()">はしるひとをえらぶ</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // 画像キャッシュ
  const images = {};
  const obstacleSources = [
    'image/sho1.png', 'image/sho2.png', 'image/sho3.png',
    'image/sho4.png', 'image/sho5.png', 'image/sho6.png'
  ];
  const runnerSources = [
    'image/run1.png', 'image/IMG_5616.png', 'image/run3.png'
  ];

  // カラフルな障害物用カラーパレット
  const obstacleColors = [
    '#ff4757', // レッド
    '#ffa502', // オレンジ
    '#eccc68', // イエロー
    '#2ed573', // グリーン
    '#1e90ff', // ブルー
    '#9b59b6', // パープル
    '#ff6b81'  // ピンク
  ];

  // 画像の事前読み込み
  [...obstacleSources, ...runnerSources].forEach(src => {
    const img = new Image();
    img.src = src;
    images[src] = img;
  });

  // 画像のアスペクト比（幅/高さ）を取得する補助関数
  function getAspectRatio(src) {
    const img = images[src];
    if (img && img.complete && img.naturalHeight > 0) {
      return img.naturalWidth / img.naturalHeight;
    }
    return 1.0;
  }

  // 安全＆明るさ補正付きの画像描画関数
  function drawImageSafe(img, x, y, width, height, fallbackColor = '#ff4444', brightnessMultiplier = 1.25) {
    ctx.save();
    ctx.filter = `brightness(${brightnessMultiplier}) contrast(1.05)`;

    if (img && img.complete && img.naturalWidth !== 0) {
      try {
        ctx.drawImage(img, x, y, width, height);
      } catch(e) {
        ctx.fillStyle = fallbackColor;
        ctx.fillRect(x, y, width, height);
      }
    } else {
      ctx.fillStyle = fallbackColor;
      ctx.fillRect(x, y, width, height);
    }
    ctx.restore();
  }

  // 地面の草を描画する関数
  function drawGrass(x, y) {
    ctx.save();
    ctx.fillStyle = '#4CAF50';
    // 中央の葉
    ctx.beginPath();
    ctx.ellipse(x, y - 8, 3, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    // 左の葉
    ctx.beginPath();
    ctx.ellipse(x - 4, y - 6, 2.5, 7, -0.4, 0, Math.PI * 2);
    ctx.fill();
    // 右の葉
    ctx.beginPath();
    ctx.ellipse(x + 4, y - 6, 2.5, 7, 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ハイスコアの取得・更新機能（ブラウザに保存）
  let highScore = parseInt(localStorage.getItem('pwa_runner_highscore') || '0', 10);
  function updateHighScoreDisplays() {
    document.getElementById('high-score-select').innerText = `さいこうきろく: ${highScore}点`;
    document.getElementById('high-score-result').innerText = `さいこうきろく: ${highScore}点`;
  }
  updateHighScoreDisplays();

  // ゲームステート
  let selectedRunnerSrc = '';
  let score = 0;
  let isGameOver = false;
  let gameLoopId = null;
  let lastSpeedLevel = 0;

  // 物理プロパティ設定
  const groundY = 320; // 地面のY座標
  let player = {
    x: 80,
    y: groundY - 60,
    baseHeight: 60,
    width: 50,
    height: 60,
    vy: 0,
    gravity: 0.65,
    jumpPower: -13,
    jumpCount: 0
  };

  let obstacles = [];
  let obstacleTimer = 0;
  let nextObstacleInterval = 100;
  let gameSpeed = 5;

  // 草の装飾管理
  let grasses = [];
  let grassTimer = 0;

  // 10点ごとに障害物の出現間隔を短縮
  function getNextInterval() {
    const level = Math.floor(score / 10);
    const minInterval = Math.max(38, 90 - level * 9);
    const maxInterval = Math.max(60, 130 - level * 11);
    return Math.floor(Math.random() * (maxInterval - minInterval + 1)) + minInterval;
  }

  // 「スピードアップ！」ポップアップの表示
  function triggerSpeedUpNotice() {
    const notice = document.getElementById('speedup-notice');
    notice.classList.remove('hidden', 'pop-animation');
    void notice.offsetWidth; // リフロー発生でアニメーションリセット
    notice.classList.add('pop-animation');

    setTimeout(() => {
      notice.classList.add('hidden');
    }, 1200);
  }

  // 1. キャラクター選択
  function selectCharacter(src) {
    selectedRunnerSrc = src;
    document.getElementById('select-screen').classList.add('hidden');
    document.getElementById('ui-layer').classList.remove('hidden');
    startGame();
  }

  // 2. ゲームスタート・初期化
  function startGame() {
    score = 0;
    lastSpeedLevel = 0;
    isGameOver = false;
    gameSpeed = 5;
    obstacles = [];
    obstacleTimer = 0;
    nextObstacleInterval = getNextInterval();

    // 草の初期化（スタート時から画面上にいくつか配置）
    grasses = [];
    for (let x = 50; x < canvas.width; x += 90 + Math.random() * 50) {
      grasses.push({ x: x, y: groundY + 8 });
    }

    // プレイヤーのサイズを元画像のアスペクト比に基づいて補正
    const aspect = getAspectRatio(selectedRunnerSrc);
    player.height = player.baseHeight;
    player.width = player.height * aspect;

    player.y = groundY - player.height;
    player.vy = 0;
    player.jumpCount = 0;

    updateScoreDisplay();
    if (gameLoopId) cancelAnimationFrame(gameLoopId);
    gameLoop();
  }

  // ジャンプ処理
  function handleJump() {
    if (isGameOver) return;

    if (player.jumpCount === 0) {
      player.vy = player.jumpPower;
      player.jumpCount = 1;
    } else if (player.jumpCount === 1) {
      player.vy = player.jumpPower * 0.9;
      player.jumpCount = 2;
    }
  }

  function updateScoreDisplay() {
    document.getElementById('score-display').innerText = `スコア: ${score}`;
  }

  // 障害物のランダム生成（地上・空中・大小・ランダムカラー）
  function spawnObstacle() {
    const randomSrc = obstacleSources[Math.floor(Math.random() * obstacleSources.length)];
    const randomColor = obstacleColors[Math.floor(Math.random() * obstacleColors.length)];
    const aspect = getAspectRatio(randomSrc);

    // 20%の確率で空中障害物（ジャンプせず立っていれば頭上を通り抜ける）
    const isAir = Math.random() < 0.20;
    // 空中でない場合は25%の確率で大きな障害物
    const isBig = !isAir && Math.random() < 0.25;

    const baseHeight = isBig ? 65 : 42;
    const height = baseHeight;
    const width = height * aspect; // 元画像のアスペクト比に合わせて幅を決定

    let y;
    if (isAir) {
      // プレイヤーの頭上を通る高さ
      y = groundY - player.height - height - 12;
    } else {
      // 地上障害物
      y = groundY - height;
    }

    obstacles.push({
      x: canvas.width,
      y: y,
      width: width,
      height: height,
      src: randomSrc,
      color: randomColor, // ランダムな色を設定
      isBig: isBig,
      isAir: isAir,
      passed: false
    });
  }

  // メインゲームループ
  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 背景と地面の描画
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, canvas.width, groundY);
    ctx.fillStyle = '#8FBC8F';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    // 10点ごとにスピードアップ計算＆「スピードアップ！」表示
    const currentLevel = Math.floor(score / 10);
    if (currentLevel > lastSpeedLevel) {
      lastSpeedLevel = currentLevel;
      triggerSpeedUpNotice();
    }
    gameSpeed = 5 + Math.min(5.5, currentLevel * 0.6);

    // 地面の草の移動と描画
    grassTimer++;
    if (grassTimer > 18) {
      grasses.push({ x: canvas.width + Math.random() * 20, y: groundY + 8 });
      grassTimer = 0;
    }

    for (let i = grasses.length - 1; i >= 0; i--) {
      const g = grasses[i];
      g.x -= gameSpeed;
      drawGrass(g.x, g.y);
      if (g.x < -20) {
        grasses.splice(i, 1);
      }
    }

    // プレイヤーの物理移動
    player.vy += player.gravity;
    player.y += player.vy;

    // 着地判定
    if (player.y >= groundY - player.height) {
      player.y = groundY - player.height;
      player.vy = 0;
      player.jumpCount = 0;
    }

    // プレイヤー画像描画
    drawImageSafe(images[selectedRunnerSrc], player.x, player.y, player.width, player.height, '#333333', 1.25);

    // 障害物のタイマー更新と出現処理
    obstacleTimer++;
    if (obstacleTimer >= nextObstacleInterval) {
      spawnObstacle();
      obstacleTimer = 0;
      nextObstacleInterval = getNextInterval();
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.x -= gameSpeed;

      // 障害物画像描画（ランダムカラー付き）
      drawImageSafe(images[obs.src], obs.x, obs.y, obs.width, obs.height, obs.color, 1.25);

      // 当たり判定
      const padding = 5;
      if (
        player.x + padding < obs.x + obs.width - padding &&
        player.x + player.width - padding > obs.x + padding &&
        player.y + padding < obs.y + obs.height - padding &&
        player.y + player.height - padding > obs.y + padding
      ) {
        gameOver();
        return;
      }

      // 通過判定（地上障害物は得点加算、空中障害物は得点なし）
      if (!obs.passed && obs.x + obs.width < player.x) {
        obs.passed = true;
        if (!obs.isAir) {
          score += obs.isBig ? 3 : 1;
          updateScoreDisplay();
        }
      }

      // 画面外の障害物を消去
      if (obs.x + obs.width < 0) {
        obstacles.splice(i, 1);
      }
    }

    if (!isGameOver) {
      gameLoopId = requestAnimationFrame(gameLoop);
    }
  }

  // ゲームオーバー処理
  function gameOver() {
    isGameOver = true;
    document.getElementById('ui-layer').classList.add('hidden');
    document.getElementById('speedup-notice').classList.add('hidden');
    document.getElementById('final-score').innerText = `スコア: ${score}`;

    // ハイスコアの更新確認
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('pwa_runner_highscore', highScore.toString());
      updateHighScoreDisplays();
    }

    document.getElementById('result-screen').classList.remove('hidden');
  }

  // もう一度遊ぶ（同じキャラ）
  function retryGame() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('ui-layer').classList.remove('hidden');
    startGame();
  }

  // キャラクター選択に戻る
  function backToSelect() {
    updateHighScoreDisplays();
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('select-screen').classList.remove('hidden');
  }

  // 操作入力の設定
  const jumpBtn = document.getElementById('jump-btn');
  
  jumpBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    handleJump();
  });

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleJump();
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      handleJump();
    }
  });
</script>

</body>
</html>
