<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>はしるひとゲーム</title>
  <style>
    /* 全体・レイアウト設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #f0f4f8;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 400px;
      background: #87CEEB; /* 空の色 */
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* オーバーレイ画面（キャラ選択・リザルト） */
    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: 22px;
      color: #333;
      margin-bottom: 24px;
    }

    /* キャラクター選択画面 */
    .char-container {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    .char-card {
      background: #fff;
      border: 3px solid #e0e0e0;
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      width: 95px;
      height: 115px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    .char-card:active {
      transform: scale(0.95);
      border-color: #ff6b6b;
    }
    .char-card img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      filter: brightness(1.25) contrast(1.05);
    }

    /* ボタンデザイン */
    .btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin: 8px;
      box-shadow: 0 4px 12px rgba(255,107,107,0.4);
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-secondary {
      background: #4ecdc4;
      box-shadow: 0 4px 12px rgba(78,205,196,0.4);
    }

    /* ゲームUI（スコア表示・ジャンプボタン） */
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    #score-display {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }
    #controls {
      pointer-events: auto;
      display: flex;
      justify-content: flex-end;
    }
    #jump-btn {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: 4px solid #ff6b6b;
      color: #ff6b6b;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <!-- ゲーム描画用キャンバス -->
  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <!-- ゲームプレイ中の画面UI -->
  <div id="ui-layer" class="hidden">
    <div id="score-display">スコア: 0</div>
    <div id="controls">
      <button id="jump-btn">JUMP!</button>
    </div>
  </div>

  <!-- 1. キャラクター選択画面 -->
  <div id="select-screen" class="screen">
    <h1>はしるひとをえらんでね</h1>
    <div class="char-container">
      <div class="char-card" onclick="selectCharacter('image/run1.png')">
        <img src="image/run1.png" alt="ランナー1">
      </div>
      <div class="char-card" onclick="selectCharacter('image/IMG_5616.png')">
        <img src="image/IMG_5616.png" alt="ランナー2">
      </div>
      <div class="char-card" onclick="selectCharacter('image/run3.png')">
        <img src="image/run3.png" alt="ランナー3">
      </div>
    </div>
  </div>

  <!-- 2. リザルト画面 -->
  <div id="result-screen" class="screen hidden">
    <h1>ゲームオーバー</h1>
    <p id="final-score" style="font-size: 26px; margin-bottom: 20px; font-weight: bold; color: #333;">スコア: 0</p>
    <button class="btn" onclick="retryGame()">もう一度</button>
    <button class="btn btn-secondary" onclick="backToSelect()">はしるひとをえらぶ</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // 画像キャッシュ
  const images = {};
  const obstacleSources = [
    'image/sho1.png', 'image/sho2.png', 'image/sho3.png',
    'image/sho4.png', 'image/sho5.png', 'image/sho6.png'
  ];
  const runnerSources = [
    'image/run1.png', 'image/IMG_5616.png', 'image/run3.png'
  ];

  // 画像の事前読み込み
  [...obstacleSources, ...runnerSources].forEach(src => {
    const img = new Image();
    img.src = src;
    images[src] = img;
  });

  // 安全＆明るさ補正付きの画像描画関数
  function drawImageSafe(img, x, y, width, height, fallbackColor = '#ff4444', brightnessMultiplier = 1.25) {
    ctx.save();
    ctx.filter = `brightness(${brightnessMultiplier}) contrast(1.05)`;

    if (img && img.complete && img.naturalWidth !== 0) {
      try {
        ctx.drawImage(img, x, y, width, height);
      } catch(e) {
        ctx.fillStyle = fallbackColor;
        ctx.fillRect(x, y, width, height);
      }
    } else {
      ctx.fillStyle = fallbackColor;
      ctx.fillRect(x, y, width, height);
    }
    ctx.restore();
  }

  // ゲームステート
  let selectedRunnerSrc = '';
  let score = 0;
  let isGameOver = false;
  let gameLoopId = null;

  // 物理プロパティ設定
  const groundY = 320; // 地面のY座標
  let player = {
    x: 80,
    y: groundY - 60,
    width: 50,
    height: 60,
    vy: 0,
    gravity: 0.65,
    jumpPower: -13,
    jumpCount: 0 // 0:接地, 1:ジャンプ1回目, 2:ダブルジャンプ
  };

  let obstacles = [];
  let obstacleTimer = 0;
  let nextObstacleInterval = 100; // 次の障害物が出るまでの待ち時間
  let gameSpeed = 5;

  // スコア（15点ごと）に応じた障害物の出現間隔を計算する関数
  function getNextInterval() {
    const level = Math.floor(score / 15); // 15点ごとにレベル1上昇
    // レベルが上がるほど出現間隔の最小値・最大値が狭くなる
    const minInterval = Math.max(40, 95 - level * 10);
    const maxInterval = Math.max(65, 135 - level * 12);
    return Math.floor(Math.random() * (maxInterval - minInterval + 1)) + minInterval;
  }

  // 1. キャラクター選択
  function selectCharacter(src) {
    selectedRunnerSrc = src;
    document.getElementById('select-screen').classList.add('hidden');
    document.getElementById('ui-layer').classList.remove('hidden');
    startGame();
  }

  // 2. ゲームスタート・初期化
  function startGame() {
    score = 0;
    isGameOver = false;
    gameSpeed = 5;
    obstacles = [];
    obstacleTimer = 0;
    nextObstacleInterval = getNextInterval();

    player.y = groundY - player.height;
    player.vy = 0;
    player.jumpCount = 0;

    updateScoreDisplay();
    if (gameLoopId) cancelAnimationFrame(gameLoopId);
    gameLoop();
  }

  // ジャンプ処理
  function handleJump() {
    if (isGameOver) return;

    if (player.jumpCount === 0) {
      player.vy = player.jumpPower;
      player.jumpCount = 1;
    } else if (player.jumpCount === 1) {
      player.vy = player.jumpPower * 0.9;
      player.jumpCount = 2;
    }
  }

  function updateScoreDisplay() {
    document.getElementById('score-display').innerText = `スコア: ${score}`;
  }

  // 障害物のランダム生成
  function spawnObstacle() {
    const randomSrc = obstacleSources[Math.floor(Math.random() * obstacleSources.length)];
    const isBig = Math.random() < 0.25; // 25%の確率で大きい障害物
    const baseSize = 45;
    const width = isBig ? baseSize * 1.5 : baseSize;
    const height = isBig ? baseSize * 1.6 : baseSize;

    obstacles.push({
      x: canvas.width,
      y: groundY - height,
      width: width,
      height: height,
      src: randomSrc,
      isBig: isBig,
      passed: false
    });
  }

  // メインゲームループ
  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 背景と地面の描画
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, canvas.width, groundY);
    ctx.fillStyle = '#8FBC8F';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    // プレイヤーの物理移動
    player.vy += player.gravity;
    player.y += player.vy;

    // 着地判定
    if (player.y >= groundY - player.height) {
      player.y = groundY - player.height;
      player.vy = 0;
      player.jumpCount = 0;
    }

    // プレイヤー画像描画
    drawImageSafe(images[selectedRunnerSrc], player.x, player.y, player.width, player.height, '#333333', 1.25);

    // 障害物のタイマー更新とランダム出現処理
    obstacleTimer++;
    if (obstacleTimer >= nextObstacleInterval) {
      spawnObstacle();
      obstacleTimer = 0;
      nextObstacleInterval = getNextInterval(); // 次の障害物までの間隔を再計算
    }

    // スコア15点ごとにスピードも緩やかにアップ
    const currentLevel = Math.floor(score / 15);
    gameSpeed = 5 + Math.min(5, currentLevel * 0.7);

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.x -= gameSpeed;

      // 障害物画像描画
      drawImageSafe(images[obs.src], obs.x, obs.y, obs.width, obs.height, '#ff4444', 1.25);

      // 当たり判定
      const padding = 6;
      if (
        player.x + padding < obs.x + obs.width - padding &&
        player.x + player.width - padding > obs.x + padding &&
        player.y + padding < obs.y + obs.height - padding &&
        player.y + player.height - padding > obs.y + padding
      ) {
        gameOver();
        return;
      }

      // 回避成功判定（障害物を通り過ぎたら得点加算）
      if (!obs.passed && obs.x + obs.width < player.x) {
        obs.passed = true;
        score += obs.isBig ? 3 : 1;
        updateScoreDisplay();
      }

      // 画面外の障害物を消去
      if (obs.x + obs.width < 0) {
        obstacles.splice(i, 1);
      }
    }

    if (!isGameOver) {
      gameLoopId = requestAnimationFrame(gameLoop);
    }
  }

  // ゲームオーバー処理
  function gameOver() {
    isGameOver = true;
    document.getElementById('ui-layer').classList.add('hidden');
    document.getElementById('final-score').innerText = `スコア: ${score}`;
    document.getElementById('result-screen').classList.remove('hidden');
  }

  // もう一度遊ぶ（同じキャラ）
  function retryGame() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('ui-layer').classList.remove('hidden');
    startGame();
  }

  // キャラクター選択に戻る
  function backToSelect() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('select-screen').classList.remove('hidden');
  }

  // 操作入力の設定
  const jumpBtn = document.getElementById('jump-btn');
  
  jumpBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    handleJump();
  });

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleJump();
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      handleJump();
    }
  });
</script>

</body>
</html>
